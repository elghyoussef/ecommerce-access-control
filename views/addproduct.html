<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link href='https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css' rel='stylesheet'>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
        }
        .container {
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            max-width: 1000px;
            width: 100%;
            margin: auto; /* Center horizontally */
        }
        h1 {
          font-family: 'Roboto', sans-serif; /* Changement de la famille de police */
          font-size: 28px; /* Taille de la police */
          color: #000000; /* Couleur du texte */
          margin-bottom: 20px;
          text-align: center;
        }
        label {
            margin-bottom: 5px;
            color: #495057;
            font-weight: bold;
            font-size: 14px; /* Diminution de la taille de la police */
            text-align: left; /* Alignement à gauche */
            display: block; /* Permet l'alignement à gauche */
            margin-left: 16px; /* Décalage à droite */
        }
        .input-container {
            width: 93%; /* Largeur des champs */
            margin-bottom: 15px; /* Réduction de l'espace entre les champs */
            position: relative;
        }
        input {
            width: 100%; /* Largeur des champs */
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            transition: border-color 0.3s;
            font-size: 14px; /* Diminution de la taille de la police */
        }
        button {
            width: 98%; /* Largeur du bouton */
            padding: 12px;
            background: coral;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px; /* Diminution de la taille de la police */
        }
        button:hover {
            background: darkorange;
        }
        .nav-link {
            color: #000000; /* Couleur du texte */
        }
        .nav-link:hover {
            color: coral; /* Couleur au survol */
        }
        .icon {
            margin-right: 8px; /* Espace entre l'icône et le texte */
            vertical-align: middle; /* Alignement vertical */
            font-size: 20px; /* Augmentation de la taille de l'icône */
        }
    </style>
</head>
<body style="padding-top: 90px;">

<nav class="navbar navbar-expand-lg navbar-light bg-white py-3 fixed-top mx-3">
    <a href="home"><img src="/img/logo1.png" alt="logo"></a>
    <button id="bar" class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="home">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="shop">Shop</a></li>
            <li class="nav-item"><a class="nav-link" href="admin">Admin Page</a></li>
            <li class="nav-item"><a class="nav-link" href="login">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container" style="max-width: 1200px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Admin Page</h1>
    <div>
      <a href="/orders" class="btn btn-primary" style="min-width:150px;"><i class='bx bx-list-ul'></i> Voir les commandes</a>
      <a href="/policy" class="btn btn-warning ml-2" style="min-width:150px;"><i class='bx bx-shield'></i> Policy ABAC</a>
    </div>
  </div>
  <div class="row">
    <!-- Product Management (Left) -->
    <div class="col-md-6 border-right">
      <div class="mb-4" id="admin-form">
        <h4>Ajouter un produit</h4>
        <form id="productForm" action="/submit" method="POST" enctype="multipart/form-data">
          <div class="input-container">
            <label for="productName"><i class='bx bx-package icon'></i>Nom du produit:</label>
            <input type="text" id="productName" name="name" required>
          </div>
          <div class="input-container">
            <label for="productPrice"><i class='bx bx-dollar icon'></i>Prix du produit:</label>
            <input type="number" id="productPrice" name="price" required>
          </div>
          <div class="input-container">
            <label for="productImage"><i class='bx bx-image icon'></i>Image du produit:</label>
            <input type="file" id="productImage" name="imgsrc" accept="image/*" required>
          </div>
          <button type="submit" class="btn btn-success">Ajouter le produit</button>
        </form>
      </div>
      <h4 class="mb-3", style="padding-top: 75px;">Liste des produits</h4>
      <div id="product-list-section">
        <table class="table table-bordered table-hover bg-white">
          <thead class="thead-dark">
            <tr>
              <th>ID</th>
              <th>Image</th>
              <th>Nom</th>
              <th>Prix</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="product-list">
            <!-- Les produits seront chargés ici dynamiquement -->
          </tbody>
        </table>
      </div>
    </div>
    <!-- User Management (Right) -->
    <div class="col-md-6">
      <div class="mb-4" id="user-form">
        <h4>Créer un utilisateur</h4>
        <form id="createUserForm">
          <div class="input-container">
            <label for="username"><i class='bx bx-user icon'></i>Nom d'utilisateur:</label>
            <input type="text" id="username" name="username" required>
          </div>
          <div class="input-container">
            <label for="useremail"><i class='bx bx-envelope icon'></i>Email:</label>
            <input type="email" id="useremail" name="email" required>
          </div>
          <div class="input-container">
            <label for="userpassword"><i class='bx bx-lock icon'></i>Mot de passe:</label>
            <input type="password" id="userpassword" name="password" required>
          </div>
          <div class="input-container">
            <label for="isAdmin"><i class='bx bx-shield icon'></i>Admin ?</label>
            <select id="isAdmin" name="isAdmin" class="form-control">
              <option value="false">Non</option>
              <option value="true">Oui</option>
            </select>
          </div>
          <div class="input-container">
            <label for="userbirthday"><i class='bx bx-calendar icon'></i>Date de naissance:</label>
            <input type="date" id="userbirthday" name="birthday" required>
          </div>
          <button type="submit" class="btn btn-success">Créer l'utilisateur</button>
        </form>
      </div>
      <h4 class="mb-3">Liste des utilisateurs</h4>
      <div id="user-list-section">
        <table class="table table-bordered table-hover bg-white">
          <thead class="thead-dark">
            <tr>
              <th>ID</th>
              <th>Nom</th>
              <th>Email</th>
              <th>Admin</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="user-list">
            <!-- Les utilisateurs seront chargés ici dynamiquement -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- JavaScript Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
<script>
// Charger et afficher les produits dynamiquement
function fetchProducts() {
    fetch('/api/products')
        .then(res => res.json())
        .then(products => {
            const tbody = document.getElementById('product-list');
            tbody.innerHTML = ''; // Clear existing rows
            products.forEach(product => {
                let finalImgSrc = '/img/placeholder.png'; // Default placeholder image

                if (product.imgsrc && typeof product.imgsrc === 'string' && product.imgsrc.trim() !== '') {
                    // Assuming product.imgsrc from API is already the correct root-relative path
                    // e.g., "/uploads/image.jpg" or "/img/shop/image.jpg"
                    // Normalize backslashes to forward slashes, just in case they ever appear.
                    finalImgSrc = product.imgsrc.replace(/\\/g, '/');
                }

                tbody.innerHTML += `
                <tr>
                    <td>${product.id}</td>
                    <td><img src="${finalImgSrc}" alt="${product.name || 'Product'}" style="width:60px;height:60px;object-fit:cover;">
                    <input type="file" id="img-${product.id}" accept="image/*" class="form-control form-control-sm mt-1"></td>

                    <td><input type="text" value="${product.name || ''}" id="name-${product.id}" class="form-control form-control-sm"></td>
                    <td><input type="number" value="${product.price || 0}" id="price-${product.id}" class="form-control form-control-sm"></td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editProduct(${product.id})">Modifier</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteProduct(${product.id})">Supprimer</button>
                    </td>
                </tr>`;
            });
        })
                .catch(error => {
            console.error('Error fetching products:', error);
            const tbody = document.getElementById('product-list');
            tbody.innerHTML = '<tr><td colspan="5">Erreur lors du chargement des produits.</td></tr>';
        });
}
function deleteProduct(id) {
    if(confirm('Voulez-vous vraiment supprimer ce produit ?')) {
        fetch('/delete-product', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        })
        .then(res => res.text())
        .then(() => fetchProducts());
    }
}
function editProduct(id) {
    const name = document.getElementById('name-' + id).value;
    const price = document.getElementById('price-' + id).value;
    const imgInput = document.getElementById('img-' + id);
    const formData = new FormData();
    formData.append('id', id);
    formData.append('name', name);
    formData.append('price', price);
    if (imgInput && imgInput.files.length > 0) {
        formData.append('imgsrc', imgInput.files[0]);
    }

    fetch('/edit-product', {
        method: 'POST',
        body: formData
    })
    .then(res => res.text())
    .then(() => fetchProducts());
}

// User Management JS
function fetchUsers() {
  fetch('/api/users')
    .then(res => res.json())
    .then(users => {
      const tbody = document.getElementById('user-list');
      tbody.innerHTML = '';
      users.forEach(user => {
        tbody.innerHTML += `
          <tr>
            <td>${user.id}</td>
            <td><input type="text" value="${user.username}" id="username-${user.id}" class="form-control form-control-sm"></td>
            <td><input type="email" value="${user.email}" id="email-${user.id}" class="form-control form-control-sm" disabled></td>
            <td>
              <select id="isAdmin-${user.id}" class="form-control form-control-sm">
                <option value="false" ${user.isAdmin ? '' : 'selected'}>Non</option>
                <option value="true" ${user.isAdmin ? 'selected' : ''}>Oui</option>
              </select>
            </td>
            <td>
              <button class="btn btn-secondary btn-sm mb-1" onclick="resetPassword(${user.id}, '${user.username}')">Reset mot de passe</button>
              <button class="btn btn-warning btn-sm mb-1" onclick="editUser(${user.id})">Modifier</button>
              <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">Supprimer</button>
            </td>
          </tr>`;
      });
    });
}
function deleteUser(id) {
  if(confirm('Voulez-vous vraiment supprimer cet utilisateur ?')) {
    fetch('/delete-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    })
    .then(res => res.text())
    .then(() => fetchUsers());
  }
}
function editUser(id) {
  const username = document.getElementById('username-' + id).value;
  const isAdmin = document.getElementById('isAdmin-' + id).value === 'true';
  
  // Show loading state
  const editButton = document.querySelector(`button[onclick="editUser(${id})"]`);
  const originalText = editButton.textContent;
  editButton.textContent = 'Modification...';
  editButton.disabled = true;

  fetch('/edit-user', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, username, isAdmin })
  })
  .then(res => {
    if (!res.ok) {
      throw new Error('Network response was not ok');
    }
    return res.json();
  })
  .then(data => {
    if (data.success) {
      alert('Utilisateur modifié avec succès');
      fetchUsers(); // Refresh the user list
    } else {
      throw new Error(data.message || 'Erreur lors de la modification');
    }
  })
  .catch(error => {
    console.error('Error:', error);
    alert('Erreur lors de la modification de l\'utilisateur');
  })
  .finally(() => {
    // Reset button state
    editButton.textContent = originalText;
    editButton.disabled = false;
  });
}
function resetPassword(id, username) {
  if(confirm(`Voulez-vous vraiment réinitialiser le mot de passe de ${username} à 00000000 ?`)) {
    fetch('/edit-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        id, 
        username, // Include the username when resetting password
        password: '00000000',
        isAdmin: document.getElementById(`isAdmin-${id}`).value === 'true' // Preserve admin status
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        alert('Mot de passe réinitialisé avec succès');
        fetchUsers();
      } else {
        throw new Error(data.message || 'Erreur lors de la réinitialisation du mot de passe');
      }
    })
  }
}
document.getElementById('createUserForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const email = document.getElementById('useremail').value;
  const password = document.getElementById('userpassword').value;
  const isAdmin = document.getElementById('isAdmin').value;
  const birthday = document.getElementById('userbirthday').value;
  fetch('/create-user', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, email, password, isAdmin, birthday, isVIP: 0, vip_expiry_date: null })
  })
  .then(res => res.text())
  .then(() => {
    fetchUsers();
    document.getElementById('createUserForm').reset();
  });
});
document.addEventListener('DOMContentLoaded', function() {
  fetchProducts();
  fetchUsers();
});
</script>

</body>
</html>

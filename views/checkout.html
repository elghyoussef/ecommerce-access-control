<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link href='https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Hauteur de la vue */
        }
        .container {
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            width: 400px; /* Ajustement de la largeur */
            text-align: center;
        }
        h1 {
            color: #343a40;
            margin-bottom: 15px;
            font-size: 20px;
        }
        input {
            width: 93%;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            transition: border-color 0.3s;
            font-size: 14px;
        }
        button {
            width: 98%;
            padding: 12px;
            background: coral;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px; /* Espace entre les boutons */
        }
        button:hover {
            background: coral;
        }
        .cancel {
            background: #65252b;
        }
        .cancel:hover {
            background: #65252b;
        }
        .checkout-flex {
          display: flex;
          justify-content: center;
          align-items: flex-start;
          gap: 40px;
          margin-top: 100px;
        }
        .checkout-left, .checkout-right {
          background: #fff;
          padding: 24px 20px;
          border-radius: 8px;
          box-shadow: 0 0 15px rgba(0,0,0,0.08);
        }
        .checkout-left {
          min-width: 340px;
          max-width: 400px;
        }
        .checkout-right {
          min-width: 340px;
          max-width: 400px;
        }
        #cart-summary {
          margin-top: 10px;
        }
        @media (max-width: 900px) {
          .checkout-flex {
            flex-direction: column;
            align-items: stretch;
          }
          .checkout-left, .checkout-right {
            max-width: 100%;
            min-width: 0;
            margin-bottom: 24px;
          }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white py-3 fixed-top mx-3">
    <a href="home"><img src="/img/logo1.png" alt="logo"></a>
    <button id="bar" class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="home">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="shop">Shop</a></li>
            <li class="nav-item"><a class="nav-link" href="login">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="checkout-flex">
  <!-- Left: Payment -->
  <div class="checkout-left">
    <h1><i class='bx bxs-wallet'></i> Paiement</h1>
    <form id="payment-form" autocomplete="off">
        <input type="text" class="inputs" id="card-name" placeholder="Nom sur la carte" required>
        <input type="text" class="inputs" id="card-number" placeholder="Numéro de la carte" maxlength="16" required pattern="\d{16}">
        <input type="text" class="inputs" id="card-expiry" placeholder="Date d'expiration (MM/AA)" required>
        <input type="text" class="inputs" id="card-cvc" placeholder="CVC" maxlength="3" required pattern="\d{3}">
        <input type="email" class="inputs" id="card-email" placeholder="Adresse email" style="display:none;" autocomplete="email">
        <div id="payment-error" style="color: #c00; margin-bottom: 10px; display: none;"></div>
        <button type="submit">Payer</button>
        <button type="button" class="cancel" onclick="history.back()">Annuler</button>
    </form>
    <div class="col-lg-3 col-md-6 col-12 mb-4">
      <img src="/img/payment.png" alt="">
    </div>
  </div>
  <!-- Right: Cart summary -->
  <div class="checkout-right">
    <h2>Votre Panier</h2>
    <div id="cart-summary">
      <!-- Cart items will be loaded here -->
    </div>
  </div>
</div>

<!-- JavaScript Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
<script>
// Fetch cart from backend session and render
function renderCheckoutCart() {
  fetch('/api/cart')
    .then(res => {
      if (res.status === 401) {
        window.location.href = '/login';
        return Promise.reject('Not authenticated');
      }
      return res.json();
    })
    .then(cart => {
      let cartSummary = document.getElementById('cart-summary');
      if (!cart || !cart.length) {
        cartSummary.innerHTML = '<p>Votre panier est vide.</p>';
        return;
      }
      let total = 0;
      let html = '<table class="table"><thead><tr><th>Produit</th><th>Prix</th><th>Quantité</th><th>Total</th></tr></thead><tbody>';
      cart.forEach(item => {
        let itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `<tr><td>${item.name}</td><td>${item.price.toFixed(2)} €</td><td>${item.quantity}</td><td>${itemTotal.toFixed(2)} €</td></tr>`;
      });
      html += `</tbody></table><div class="text-right font-weight-bold">Total: ${total.toFixed(2)} €</div>`;
      cartSummary.innerHTML = html;
    })
    .catch(err => {
      document.getElementById('cart-summary').innerHTML = '<p>Erreur lors du chargement du panier.</p>';
    });
}
document.addEventListener('DOMContentLoaded', renderCheckoutCart);

// Payment form validation and submission
const paymentForm = document.getElementById('payment-form');
const cardEmailInput = document.getElementById('card-email');

// Afficher le champ email si l'utilisateur n'est pas connecté
fetch('/api/userinfo').then(r => r.json()).then(user => {
  if (!user || !user.email) {
    cardEmailInput.style.display = '';
    cardEmailInput.required = true;
  } else {
    cardEmailInput.style.display = 'none';
    cardEmailInput.required = false;
  }
}).catch(() => {
  cardEmailInput.style.display = '';
  cardEmailInput.required = true;
});

paymentForm.addEventListener('submit', async function(e) {
  e.preventDefault();
  const cardNumber = document.getElementById('card-number').value.trim();
  const cvc = document.getElementById('card-cvc').value.trim();
  const errorDiv = document.getElementById('payment-error');
  let error = '';
  if (!/^\d{16}$/.test(cardNumber)) {
    error = 'Le numéro de carte doit contenir exactement 16 chiffres.';
  } else if (!/^\d{3}$/.test(cvc)) {
    error = 'Le CVC doit contenir exactement 3 chiffres.';
  }
  // Vérifier l'email si champ visible
  if (cardEmailInput.style.display !== 'none') {
    const emailVal = cardEmailInput.value.trim();
    if (!emailVal) {
      error = 'Veuillez saisir votre adresse email.';
    } else if (!/^\S+@\S+\.\S+$/.test(emailVal)) {
      error = 'Adresse email invalide.';
    }
  }
  if (error) {
    errorDiv.textContent = error;
    errorDiv.style.display = 'block';
    return;
  }
  errorDiv.style.display = 'none';

  // Fetch cart and user info, then send order to backend
  let cart = await fetch('/api/cart').then(r => r.json());
  if (!cart || !cart.length) {
    errorDiv.textContent = 'Votre panier est vide.';
    errorDiv.style.display = 'block';
    return;
  }
  let total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
  // Get user info from session (fetch from backend)
  let user = await fetch('/api/userinfo').then(r => r.json()).catch(() => null);
  let customer_name = user && user.username ? user.username : document.getElementById('card-name').value;
  let email = user && user.email ? user.email : cardEmailInput.value.trim();
  // Save order to backend
  let orderRes = await fetch('/api/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      customer_name,
      email,
      products: cart,
      total
    })
  });
  if (!orderRes.ok) {
    let errMsg = 'Erreur lors de l\'enregistrement de la commande.';
    try {
      const errData = await orderRes.json();
      if (errData && errData.error) {
        errMsg += ' ' + errData.error;
      }
    } catch (e) {
      // ignore JSON parse error
    }
    errorDiv.textContent = errMsg;
    errorDiv.style.display = 'block';
    return;
  }
  // Clear cart before redirecting to thank you page
  fetch('/api/cart/clear', { method: 'POST' })
    .then(() => {
      window.location.href = '/thankyou';
    });
});
</script>

</body>
</html>

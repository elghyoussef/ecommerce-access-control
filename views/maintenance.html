<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site en maintenance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .maintenance-container {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
      padding: 3rem;
      max-width: 650px;
      width: 100%;
    }

    .maintenance-icon {
      font-size: 5rem;
      color: #ffc107;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }

    .maintenance-title {
      font-weight: 700;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .maintenance-message {
      color: #6c757d;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .maintenance-footer {
      font-size: 0.9rem;
      color: #adb5bd;
      margin-top: 2rem;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .logo-container {
      margin-bottom: 2rem;
    }

    .logo-container img {
      max-width: 180px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="maintenance-container">
    <div class="logo-container">
      <img src="/img/logo1.png" alt="Logo">
    </div>
    
    <div class="maintenance-icon">
      <i class="bi bi-tools"></i>
    </div>
    
    <h1 class="maintenance-title">Site en maintenance</h1>
    
    <p class="maintenance-message">
      Nous effectuons actuellement des travaux de maintenance sur notre site pour améliorer votre expérience.
      <br><br>
      Nous serons de retour très bientôt. Merci de votre patience !
    </p>
    
    <div class="maintenance-footer">
      © <span id="year">2025</span> - Notre équipe travaille pour vous
    </div>
  </div>

  <script>
    // Set current year
    document.getElementById('year').textContent = new Date().getFullYear();
    
    // Add automatic refresh every 60 seconds
    setTimeout(() => {
      window.location.reload();
    }, 60000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
  <link href='https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css' rel='stylesheet'>
  <style>
    body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .thankyou-box { background: #fff; padding: 40px 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.10); text-align: center; }
    .thankyou-box h1 { color: #28a745; margin-bottom: 20px; }
    .thankyou-box p { font-size: 18px; margin-bottom: 30px; }
    .thankyou-box a.btn { font-size: 16px; padding: 10px 30px; }
  </style>
</head>
<body>
  <div class="thankyou-box">
    <h1><i class='bx bx-check-circle'></i> Thank You!</h1>
    <p>Your payment was successful.<br>We appreciate your shopping with us.</p>
    <a href="/home" class="btn btn-success">Back to Home</a>
  </div>
</body>
</html>
